name: Apuração 2026 (a cada 5 min)

# Os dados ficam no branch "apuracao-2026", separado do main (que é publicado no site da CriaSite).
# O arquivo do agendamento precisa morar no main porque o GitHub só roda schedules do branch principal.
on:
  schedule:
    - cron: "*/5 * 4-6 10 *"   # de 4 a 6 de outubro, a cada 5 minutos
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/apuracao-2026.yml"]

permissions:
  contents: write

concurrency:
  group: apuracao-2026
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apuracao-2026
      - name: Coletar no TSE
        run: |
          python3 coleta_apuracao.py || true
          if ! git diff --quiet -- dados.json; then
            git config user.name "apuracao-bot"
            git config user.email "apuracao-bot@users.noreply.github.com"
            git add dados.json
            git commit -q -m "Apuração 2026: dados $(TZ=America/Sao_Paulo date +%H:%M)"
            git pull -q --rebase origin apuracao-2026 || true
            git push -q origin HEAD:apuracao-2026
          fi
